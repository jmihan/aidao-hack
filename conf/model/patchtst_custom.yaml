name: PatchTST_Custom
arch:
  _target_: src.model.patchtst.model.Model
  configs:
    enc_in: 1
    seq_len: ${data.context_length}
    pred_len: ${data.prediction_length}
    patch_len: 16
    stride: 8
    e_layers: 3
    n_heads: 4
    d_model: 16
    d_ff: 128
    dropout: 0.1
    revin: true
    decomposition: false

loss:
  _target_: torch.nn.MSELoss

optimizer:
  _target_: torch.optim.AdamW
  lr: ${learning_rate}

lr_scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.2
  patience: 3